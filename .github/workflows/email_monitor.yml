name: Email Assistant & Bengali AI Notifier

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes automatically
  workflow_dispatch:        # Allows manual run from GitHub web UI anytime

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Environment Secrets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
        run: |
          python -c "
          import os, sys, json
          token_raw = os.environ.get('GOOGLE_TOKEN_JSON', '').strip()
          creds_raw = os.environ.get('GOOGLE_CREDENTIALS_JSON', '').strip()

          if not token_raw:
              print('❌ [ERROR] Secret GOOGLE_TOKEN_JSON is missing or empty in GitHub Secrets!', file=sys.stderr)
              print('👉 Solution: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions, and add GOOGLE_TOKEN_JSON with the content of token.json.', file=sys.stderr)
              sys.exit(1)

          try:
              json.loads(token_raw)
          except Exception as e:
              print(f'❌ [ERROR] GOOGLE_TOKEN_JSON in GitHub Secrets is NOT valid JSON: {e}', file=sys.stderr)
              sys.exit(1)

          with open('token.json', 'w', encoding='utf-8') as f:
              f.write(token_raw)
          print('✓ token.json created successfully')

          if creds_raw:
              with open('credentials.json', 'w', encoding='utf-8') as f:
                  f.write(creds_raw)
              print('✓ credentials.json created successfully')

          sheet_id = os.environ.get('SHEET_ID', '').strip()
          sheet_tab = os.environ.get('SHEET_TAB', '').strip() or 'Sheet1'
          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          tg_chat = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()

          env_content = f'''GOOGLE_CREDENTIALS_FILE=credentials.json
          GOOGLE_TOKEN_FILE=token.json
          SHEET_ID={sheet_id}
          SHEET_TAB={sheet_tab}
          TELEGRAM_BOT_TOKEN={tg_token}
          TELEGRAM_CHAT_ID={tg_chat}
          GEMINI_API_KEY={gemini_key}
          GEMINI_MODEL=gemini-3.5-flash
          WEEKDAYS_ONLY=false
          '''
          with open('.env', 'w', encoding='utf-8') as f:
              f.write('\n'.join(line.strip() for line in env_content.strip().split('\n')) + '\n')
          print('✓ .env configuration file created successfully')
          "

      - name: Run Email Notifier Tick
        run: |
          python main.py

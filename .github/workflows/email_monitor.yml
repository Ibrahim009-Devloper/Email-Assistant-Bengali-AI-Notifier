name: Email Assistant & Bengali AI Notifier

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes automatically
  workflow_dispatch:        # Allows manual run from GitHub web UI anytime

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Environment Secrets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
        run: |
          # Write credentials and token files from encrypted secrets
          echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          echo "$GOOGLE_TOKEN_JSON" > token.json
          
          # Create .env file for configuration
          cat <<EOF > .env
          GOOGLE_CREDENTIALS_FILE=credentials.json
          GOOGLE_TOKEN_FILE=token.json
          SHEET_ID=${SHEET_ID}
          SHEET_TAB=${SHEET_TAB:-Sheet1}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-3.5-flash
          WEEKDAYS_ONLY=false
          EOF
          # Check whether required secrets exist without exposing their values
          if [ -z "$SHEET_ID" ]; then
            echo "ERROR: SHEET_ID secret is missing or empty"
            exit 1
          else
            echo "OK: SHEET_ID secret is available"
          fi

      - name: Run Email Notifier Tick
        run: |
          python main.py
